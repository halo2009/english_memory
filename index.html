<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영어 문장 쓰기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#243d33;font-family:Arial,'Apple SD Gothic Neo',sans-serif}main{max-width:760px;margin:auto;padding:44px 20px}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}p{color:#64766b;line-height:1.7}button,textarea{font:inherit}button{padding:12px 17px;border:1px solid #cdd8cc;border-radius:10px;background:white;color:#243d33;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}.primary{background:#28533e;color:white;border-color:#28533e}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0}.card{background:white;border:1px solid #dce2d7;border-radius:18px;padding:24px}.row{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid #eceee7;cursor:pointer;line-height:1.5}.row:last-child{border:0}input{width:21px;height:21px;flex-shrink:0;accent-color:#28533e}.row small{display:block;color:#738075;margin-top:5px}.badge{font-size:13px;color:#71806f}.meaning{font-size:25px;line-height:1.6;margin:22px 0}textarea{width:100%;min-height:150px;border:1px solid #c7d4c4;background:#fcfcfa;border-radius:12px;padding:17px;resize:vertical;font-size:19px;line-height:1.6}textarea:focus{outline:2px solid #6c906d;outline-offset:2px}.result{padding:17px;background:#eef3e8;border-radius:12px;line-height:1.8;margin-top:16px;overflow-wrap:anywhere}.grammar{border-top:1px solid #d4dfcd;margin-top:12px;padding-top:12px;font-size:14px}.english{font-size:20px;color:#203f2d}.foot{font-size:12px;color:#798478;margin-top:24px}a{color:inherit}button:focus-visible{outline:3px solid #7b9766;outline-offset:3px}@media(max-width:500px){main{padding:26px 15px}.card{padding:20px}.meaning{font-size:23px}h1{font-size:29px}}
</style><main><span class="badge">ENGLISH WRITING · 20 SENTENCES</span><h1>뜻을 보고, 영어로 쓰기</h1><div id="app"></div><div class="foot">원문 순서대로 연습 · 선택한 문장은 이 브라우저에 저장됩니다.</div></main><script>
const en=['Gen Z consumers value ethics.','Their purchases show their beliefs.','Their influence has grown stronger.','Companies respond in two ways.','First, ethical companies attract buyers.','Young consumers support fair businesses.','They value workers and nature.','Choosing ethically, they reward companies.','This support increases company sales.','So companies improve their behavior.','Second, dishonest companies lose customers.','Young consumers share information online.','They check facts before buying.','They avoid brands that lie.','Bad news can spread quickly.','So companies must be honest.','They must explain their actions.','This helps build customer trust.','Consumer choices shape business ethics.','Small purchases can create change.'];
const ko=['Z세대 소비자는 윤리를 중요하게 여긴다.','그들의 구매는 그들의 신념을 보여준다.','그들의 영향력은 더 강해져 왔다.','기업들은 두 가지 방식으로 반응한다.','첫째, 윤리적인 기업은 구매자를 끌어들인다.','젊은 소비자는 공정한 기업을 지지한다.','그들은 노동자와 자연을 중요하게 여긴다.','윤리적으로 선택함으로써, 그들은 기업에 보상한다.','이러한 지지는 기업의 매출을 늘린다.','그래서 기업들은 자신들의 행동을 개선한다.','둘째, 부정직한 기업은 고객을 잃는다.','젊은 소비자는 온라인에서 정보를 공유한다.','그들은 구매 전에 사실을 확인한다.','그들은 거짓말하는 브랜드를 피한다.','나쁜 소식은 빠르게 퍼질 수 있다.','그래서 기업들은 정직해야 한다.','그들은 자신들의 행동을 설명해야 한다.','이는 고객의 신뢰를 쌓는 데 도움이 된다.','소비자의 선택은 기업 윤리를 형성한다.','작은 구매가 변화를 만들어낼 수 있다.'];
const app=document.getElementById('app');const key='english-selected-v2';let chosen=en.map((_,i)=>i),queue=[],pos=0,answers={},checked={};try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v))chosen=[...new Set(v.filter(n=>Number.isInteger(n)&&n>=0&&n<20))].sort((a,b)=>a-b)}catch{}const grammar={2:'현재완료 · has grown<br>has + 과거분사(grown): 영향력이 커져 왔다는 뜻이에요.',6:'병렬구조 · workers and nature<br>명사 workers와 nature를 and로 대등하게 연결해요.',7:'분사구문 · Choosing ethically<br>주어는 뒤 문장의 they와 같아요. 여기서는 ‘윤리적으로 선택함으로써’라는 뜻이에요.'};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(chosen))}catch{}}function selection(){app.innerHTML='<p>연습할 문장을 체크해 줘. 선택한 문장만 위에서부터 차례로 나와.</p><div class="bar"><button id="all">전체 선택</button><button id="none">전체 해제</button><span id="amount" class="badge"></span></div><div class="card">'+en.map((s,i)=>'<label class="row"><input type="checkbox" data-index="'+i+'" '+(chosen.includes(i)?'checked':'')+'><span><b>'+String(i+1).padStart(2,'0')+'.</b> '+esc(s)+'<small>'+esc(ko[i])+'</small></span></label>').join('')+'</div><div class="bar"><button class="primary" id="start"></button></div>';app.querySelectorAll('input').forEach(el=>el.onchange=()=>{const n=Number(el.dataset.index);chosen=el.checked?[...chosen,n].sort((a,b)=>a-b):chosen.filter(x=>x!==n);save();count()});document.getElementById('all').onclick=()=>{chosen=en.map((_,i)=>i);save();selection()};document.getElementById('none').onclick=()=>{chosen=[];save();selection()};document.getElementById('start').onclick=()=>{queue=chosen.slice().sort((a,b)=>a-b);pos=0;practice();window.scrollTo(0,0)};count()}
function count(){document.getElementById('amount').textContent=chosen.length+'문장 선택';const b=document.getElementById('start');b.textContent='선택한 '+chosen.length+'문장 연습 시작';b.disabled=!chosen.length}function remember(){const a=document.getElementById('answer');if(a)answers[queue[pos]]=a.value}
function practice(){const n=queue[pos];app.innerHTML='<div class="bar"><button id="back">← 문장 다시 선택</button></div><section class="card"><div class="badge">'+(pos+1)+' / '+queue.length+' · 원문 '+(n+1)+'번</div><div class="meaning">'+esc(ko[n])+'</div><label class="badge" for="answer">영어로 써 보세요</label><textarea id="answer" placeholder="영어 문장 입력" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><p class="badge">대소문자와 문장부호는 채점하지 않아요.</p><button id="check" class="primary">정답 확인</button><div id="feedback" role="status" aria-live="polite"></div><div class="bar"><button id="prev" '+(!pos?'disabled':'')+'>← 이전</button><button id="next">'+(pos===queue.length-1?'연습 마치기':'다음 →')+'</button></div></section>';document.getElementById('answer').value=answers[n]||'';document.getElementById('answer').oninput=()=>{delete checked[n];document.getElementById('feedback').innerHTML=''};document.getElementById('back').onclick=()=>{remember();selection()};document.getElementById('check').onclick=check;document.getElementById('prev').onclick=()=>{remember();pos--;practice()};document.getElementById('next').onclick=()=>{remember();if(pos<queue.length-1){pos++;practice()}else finish()};if(checked[n])result(n,checked[n])}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim()}function check(){remember();const n=queue[pos];if(!answers[n].trim()){document.getElementById('feedback').textContent='영어 문장을 먼저 입력해 줘.';return}checked[n]=norm(answers[n])===norm(en[n])?'correct':'wrong';result(n,checked[n])}function result(n,state){document.getElementById('feedback').innerHTML='<div class="result"><b>'+(state==='correct'?'✓ 정확해!':'원문과 비교해 봐.')+'</b><div class="english">'+esc(en[n])+'</div>'+(grammar[n]?'<div class="grammar">'+grammar[n]+'</div>':'')+'</div>'}
function finish(){app.innerHTML='<div class="card"><h2>선택한 문장을 끝까지 연습했어.</h2><p>'+queue.length+'문장 중 정답 확인을 한 문장: '+queue.filter(n=>checked[n]).length+'개<br>맞힌 문장: '+queue.filter(n=>checked[n]==='correct').length+'개</p><div class="bar"><button id="again" class="primary">같은 문장 다시 연습</button><button id="select">문장 다시 선택</button></div></div>';document.getElementById('again').onclick=()=>{pos=0;answers={};checked={};practice()};document.getElementById('select').onclick=selection}selection();
</script></html>
