<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문장 한 걸음 | 영어 암기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#203e35;font-family:Arial,'Apple SD Gothic Neo',sans-serif}button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;border:1px solid #d4ddd5;background:white;color:#203e35;border-radius:12px;padding:13px 18px}button:hover{background:#e9eee6}button.active,.primary{background:#234f41;color:white;border-color:#234f41}header{max-width:1180px;margin:auto;padding:27px 32px;display:flex;justify-content:space-between;border-bottom:1px solid #d9dfd7}.brand{font-weight:800}header small{color:#6e7d72}main{max-width:1180px;margin:auto;padding:45px 32px}.eyebrow{font-size:12px;letter-spacing:2px;color:#6d8071}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-2px;margin:15px 0}p{line-height:1.7;color:#728075}.layout{display:grid;grid-template-columns:240px 1fr;gap:32px;margin-top:32px}aside button{display:block;width:100%;text-align:left;margin-bottom:10px;padding:20px}aside small{display:block;margin-top:7px;opacity:.7}.panel{background:#fff;border:1px solid #dee3d9;border-radius:24px;padding:30px;box-shadow:0 12px 35px #183b2405}.modes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:28px}.modes button{padding:10px 15px}.cardtop{display:flex;justify-content:space-between;color:#718275;font-size:13px}.sentence{font-size:clamp(25px,3.5vw,37px);line-height:1.5;min-height:110px;margin:32px 0 15px;letter-spacing:-.6px}mark{background:#e8efb5;color:inherit;border-radius:4px}#meaning{color:#65776b;font-size:17px;min-height:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}textarea{width:100%;border:1px solid #cdd9ce;border-radius:14px;padding:18px;min-height:115px;resize:vertical;color:#203e35;background:#fafbf7}#feedback{line-height:1.6;margin-top:14px;white-space:pre-wrap}.nav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e7eae2;padding-top:22px;margin-top:25px}.track{height:6px;background:#e4e9de;border-radius:10px;margin:18px 0}.fill{height:100%;background:#88a66a;border-radius:10px}.tip{font-size:13px;padding:18px;background:#e9eddf;border-radius:13px;margin-top:20px;line-height:1.8}.listrow{padding:17px 0;border-bottom:1px solid #eee;line-height:1.6}.listrow small{display:block;color:#728075}.muted{font-size:12px;color:#7b877c}footer{margin-top:25px;color:#7b877c;font-size:12px}@media(max-width:720px){header{padding:20px}main{padding:28px 18px}.layout{grid-template-columns:1fr;gap:14px}aside{display:grid;grid-template-columns:1fr 1fr;gap:8px}aside button{margin:0;padding:13px}.panel{padding:22px}header small{display:none}.sentence{min-height:100px}}
</style><header><span class="brand">◒ 문장 한 걸음</span><small>HALO’S ENGLISH PRACTICE · 20 SENTENCES</small></header><main><div class="eyebrow">작게 나누고, 기억하고, 완성하기</div><h1>한 문장씩, 내 것으로.</h1><p>Gen Z의 소신 소비와 기업 윤리 경영<br>읽기 → 빈칸 → 첫 글자 → 직접 쓰기 순서로 연습해 봐.</p><div class="layout"><aside id="groups"></aside><section class="panel"><div class="modes" id="modes"></div><div class="cardtop"><span id="label"></span><span id="count"></span></div><div class="track"><div class="fill" id="fill"></div></div><div id="content"></div><div class="nav"><button id="prev">← 이전</button><span id="mastery" class="muted"></span><button id="next" class="primary">다음 →</button></div></section></div><footer>원문 20문장 그대로 · 학습 기록은 이 브라우저에 저장됩니다.</footer></main><script>
const en=['Gen Z consumers value ethics.','Their purchases show their beliefs.','Their influence has grown stronger.','Companies respond in two ways.','First, ethical companies attract buyers.','Young consumers support fair businesses.','They value workers and nature.','Choosing ethically, they reward companies.','This support increases company sales.','So companies improve their behavior.','Second, dishonest companies lose customers.','Young consumers share information online.','They check facts before buying.','They avoid brands that lie.','Bad news can spread quickly.','So companies must be honest.','They must explain their actions.','This helps build customer trust.','Consumer choices shape business ethics.','Small purchases can create change.'];
const ko=['Z세대 소비자는 윤리를 중요하게 여긴다.','그들의 구매는 그들의 신념을 보여준다.','그들의 영향력은 더 강해져 왔다.','기업들은 두 가지 방식으로 반응한다.','첫째, 윤리적인 기업은 구매자를 끌어들인다.','젊은 소비자는 공정한 기업을 지지한다.','그들은 노동자와 자연을 중요하게 여긴다.','윤리적으로 선택함으로써, 그들은 기업에 보상한다.','이러한 지지는 기업의 매출을 늘린다.','그래서 기업들은 자신들의 행동을 개선한다.','둘째, 부정직한 기업은 고객을 잃는다.','젊은 소비자는 온라인에서 정보를 공유한다.','그들은 구매 전에 사실을 확인한다.','그들은 거짓말하는 브랜드를 피한다.','나쁜 소식은 빠르게 퍼질 수 있다.','그래서 기업들은 정직해야 한다.','그들은 자신들의 행동을 설명해야 한다.','이는 고객의 신뢰를 쌓는 데 도움이 된다.','소비자의 선택은 기업 윤리를 형성한다.','작은 구매가 변화를 만들어낼 수 있다.'];
const groups=[['01 도입',0,4,'가치 → 구매 → 영향력 → 반응'],['02 첫 번째 관계',4,10,'지지 → 매출 증가 → 행동 개선'],['03 두 번째 관계',10,18,'거짓 회피 → 정직 → 신뢰'],['04 결론',18,20,'소비 선택 → 기업 변화'],['전체 20문장',0,20,'처음부터 끝까지 이어서 연습']];
let g=0,i=0,mode=0,done={};try{done=JSON.parse(localStorage.getItem('halo-memory-v1')||'{}')}catch{};const $=id=>document.getElementById(id);const modes=['읽고 익히기','빈칸 채우기','첫 글자 힌트','직접 쓰기','전체 보기'];const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
function render(){const a=groups[g];$('groups').innerHTML=groups.map((x,j)=>`<button class="${g===j?'active':''}" onclick="choose(${j})">${x[0]}<small>${x[2]-x[1]}문장 · ${x[3]}</small></button>`).join('');$('modes').innerHTML=modes.map((x,j)=>`<button class="${mode===j?'active':''}" onclick="setmode(${j})">${x}</button>`).join('');$('label').textContent=a[0];$('count').textContent=`${i-a[1]+1} / ${a[2]-a[1]}`;$('fill').style.width=((i-a[1]+1)/(a[2]-a[1])*100)+'%';$('mastery').textContent=`암기 완료 ${Object.keys(done).filter(k=>done[k]).length} / 20`;
if(mode===4){$('content').innerHTML=en.slice(a[1],a[2]).map((s,j)=>`<div class="listrow"><b>${a[1]+j+1}.</b> ${highlight(s)}<small>${ko[a[1]+j]}</small></div>`).join('');return}
let display=highlight(en[i]);if(mode===1)display=en[i].split(' ').map((w,j)=>j%2===1?'_____':w).join(' ');if(mode===2)display=en[i].split(' ').map(w=>w[0]+'＿'.repeat(Math.min(w.replace(/[^a-z]/gi,'').length-1,6))).join(' ');if(mode===3)display='이 문장, 기억나나요?';$('content').innerHTML=`<div class="sentence">${display}</div><div id="meaning">${ko[i]}</div>${mode?'<p class="muted">빈칸 모드에서도 문장 전체를 입력해 주세요. 대소문자와 문장부호는 채점하지 않아요.</p><textarea id="answer" aria-label="영어 문장 입력" placeholder="기억나는 영어 문장을 적어 보세요." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>':''}<div class="actions">${mode?'<button class="primary" onclick="check()">정답 확인</button><button onclick="reveal()">정답 보기</button>':'<button onclick="toggleMeaning()">해석 숨기기 / 보기</button>'}<button onclick="speak()">▷ 문장 듣기</button><button onclick="master()">${done[i]?'✓ 암기 완료':'암기 완료 표시'}</button></div><div id="feedback" role="status"></div><div class="tip">흐름 기억하기 · ${a[3]}${i===2?'<br>현재완료: <b>has grown</b>':i===6?'<br>병렬구조: <b>workers and nature</b>':i===7?'<br>분사구문: <b>Choosing ethically</b>':''}</div>`;}
function highlight(s){return s.replace('has grown','<mark>has grown</mark>').replace('workers and nature','<mark>workers and nature</mark>').replace('Choosing ethically','<mark>Choosing ethically</mark>')}
function choose(j){g=j;i=groups[g][1];render()}function setmode(j){mode=j;render()}function toggleMeaning(){$('meaning').hidden=!$('meaning').hidden}function reveal(){$('feedback').textContent='정답: '+en[i]}function check(){let val=$('answer').value;if(!val.trim()){$('feedback').textContent='먼저 문장을 입력해 봐.';return}let ok=norm(val)===norm(en[i]);$('feedback').textContent=ok?'✓ 정확해! 다음 문장으로 넘어가도 좋아.':'다시 비교해 봐.\n정답: '+en[i];if(ok){done[i]=true;save();$('mastery').textContent=`암기 완료 ${Object.keys(done).filter(k=>done[k]).length} / 20`}}function save(){try{localStorage.setItem('halo-memory-v1',JSON.stringify(done))}catch{}}function master(){done[i]=!done[i];save();render()}function speak(){if(!('speechSynthesis'in window)){$('feedback').textContent='이 브라우저는 읽어주기를 지원하지 않아요.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(en[i]);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}$('prev').onclick=()=>{i=i>groups[g][1]?i-1:groups[g][2]-1;render()};$('next').onclick=()=>{i=i<groups[g][2]-1?i+1:groups[g][1];render()};render();
</script></html>
